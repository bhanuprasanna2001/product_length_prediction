# Product Length Prediction — Default Configuration
#
# Usage:
#   python scripts/train.py --config configs/default.yaml

# ── Data paths ───────────────────────────────────────────────
data_dir: "data/total_sentence_data/total_sentence_data"
embedding_dir: "data/embeddings"
knn_dir: "data/knn_features"
output_dir: "checkpoints"

# ── Data splits ──────────────────────────────────────────────
train_ratio: 0.85
val_ratio: 0.10
test_ratio: 0.05

# ── Embeddings ───────────────────────────────────────────────
active_embeddings:
  - minilm       # 384d
  - mpnet        # 768d
  - distiluse    # 512d
  - e5small      # 384d

# ── KNN features ────────────────────────────────────────────
use_knn: true
knn_k: 20
knn_embeddings:
  - minilm
  - mpnet
  - distiluse
  - e5small

# ── Model architecture ──────────────────────────────────────
product_type_emb_dim: 128
hidden_dims: [1024, 256, 64]
dropout: 0.2
use_batch_norm: true

# ── Training ────────────────────────────────────────────────
batch_size: 512
lr: 1.0e-3
weight_decay: 0.01
epochs: 30
warmup_ratio: 0.05
patience: 5
gradient_clip_val: 1.0
loss_fn: "mape"
use_log_target: true

# ── Logging ─────────────────────────────────────────────────
wandb_project: "amazon-product-length"
wandb_run_name: null
log_every_n_steps: 50
val_check_interval: 0.25

# ── System ──────────────────────────────────────────────────
seed: 42
num_workers: 2
